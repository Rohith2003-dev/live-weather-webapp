<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Forecast</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide icons -->
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <style>
        /* Custom styles */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Simple loading spinner */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s ease infinite;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 to-purple-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white/70 backdrop-blur-lg shadow-2xl rounded-2xl p-6 sm:p-8 w-full max-w-md">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Live Weather</h1>

        <!-- Search Section -->
        <div class="flex flex-col sm:flex-row gap-2 mb-4">
            <input type="text" id="cityInput" placeholder="Enter city name" class="flex-grow w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:outline-none focus:border-blue-500 transition-colors" />
            <button id="searchBtn" class="w-full sm:w-auto bg-blue-600 text-white px-5 py-3 rounded-lg font-semibold hover:bg-blue-700 transition-shadow shadow-md hover:shadow-lg">
                Search
            </button>
        </div>

        <!-- Geolocation Button -->
        <button id="locationBtn" class="w-full flex items-center justify-center gap-2 bg-gray-600 text-white px-4 py-3 rounded-lg font-semibold hover:bg-gray-700 transition-shadow shadow-md hover:shadow-lg mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            Use My Location
        </button>

        <!-- Loading Spinner -->
        <div id="loading" class="flex justify-center items-center py-10 hidden">
            <div class="spinner"></div>
        </div>

        <!-- Error Message -->
        <div id="error" class="text-center text-red-600 font-semibold bg-red-100 p-4 rounded-lg hidden">
            <!-- Error message will be injected here -->
        </div>

        <!-- Weather Results -->
        <div id="weatherResult" class="hidden">
            
            <!-- Current Weather -->
            <div class="text-center bg-gradient-to-br from-blue-500 to-blue-700 text-white p-8 rounded-xl shadow-lg mb-6">
                <h2 id="locationName" class="text-3xl font-semibold">--</h2>
                <div class="flex items-center justify-center mt-4 mb-2">
                    <span id="weatherEmoji" class="text-7xl"></span>
                    <span id="currentTemp" class="text-8xl font-bold ml-4">--</span>
                    <span class="text-4xl font-light mt-2">°C</span>
                </div>
                <p id="weatherDesc" class="text-2xl capitalize text-blue-100 mb-2">--</p>
                <p id="feelsLike" class="text-lg text-blue-200">Feels like: --°C</p>
            </div>
            
            <!-- Additional Details -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-blue-50 p-4 rounded-lg shadow-sm flex items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                    <div>
                        <span class="text-sm text-gray-600">Humidity</span>
                        <p id="humidity" class="text-xl font-bold text-gray-900">--%</p>
                    </div>
                </div>
                <div class="bg-purple-50 p-4 rounded-lg shadow-sm flex items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-purple-600"><path d="M17.7 7.7a5 5 0 1 1-7.1 7.1"/><path d="M12 12H2m10 0V2m10 10v10m0-10H2m10 0V2"/></svg>
                    <div>
                        <span class="text-sm text-gray-600">Wind Speed</span>
                        <p id="windSpeed" class="text-xl font-bold text-gray-900">-- km/h</p>
                    </div>
                </div>
            </div>

            <!-- 3-Day Forecast -->
            <div>
                <h3 class="text-2xl font-bold text-gray-800 mb-4">3-Day Forecast</h3>
                <div id="forecastContainer" class="space-y-3">
                    <!-- Forecast cards will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const cityInput = document.getElementById('cityInput');
        const searchBtn = document.getElementById('searchBtn');
        const locationBtn = document.getElementById('locationBtn');
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const weatherResultEl = document.getElementById('weatherResult');

        // Current Weather Elements
        const locationNameEl = document.getElementById('locationName');
        const weatherEmojiEl = document.getElementById('weatherEmoji');
        const currentTempEl = document.getElementById('currentTemp');
        const weatherDescEl = document.getElementById('weatherDesc');
        const feelsLikeEl = document.getElementById('feelsLike');
        const humidityEl = document.getElementById('humidity');
        const windSpeedEl = document.getElementById('windSpeed');
        
        // Forecast Element
        const forecastContainer = document.getElementById('forecastContainer');

        // --- API ---
        const API_BASE_URL = 'https://wttr.in/';

        // --- Event Listeners ---
        searchBtn.addEventListener('click', handleSearch);
        cityInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });
        locationBtn.addEventListener('click', handleGetLocation);
        window.addEventListener('load', handleGetLocation); // Try to get location on load

        // --- Functions ---

        /**
         * Handles the search button click and input submit
         */
        function handleSearch() {
            const city = cityInput.value.trim();
            if (city) {
                fetchWeather(city);
            } else {
                showError('Please enter a city name.');
            }
        }

        /**
         * Tries to get the user's current geolocation
         */
        function handleGetLocation() {
            if (navigator.geolocation) {
                showLoading();
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        fetchWeather(`${latitude},${longitude}`);
                    },
                    (err) => {
                        // Handle errors (e.g., user denied permission)
                        hideLoading();
                        showError('Location access denied. Please search for a city manually.');
                    }
                );
            } else {
                showError('Geolocation is not supported by your browser.');
            }
        }

        /**
         * Fetches weather data from the wttr.in API
         * @param {string} locationQuery - The city name or lat,lon string
         */
        async function fetchWeather(locationQuery) {
            showLoading();
            hideError();
            hideWeather();

            // Simple retry mechanism
            let attempts = 0;
            const maxAttempts = 3;
            const initialDelay = 1000; // 1 second

            while (attempts < maxAttempts) {
                try {
                    const response = await fetch(`${API_BASE_URL}${encodeURIComponent(locationQuery)}?format=j1`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    if (data && data.current_condition && data.weather) {
                        displayWeather(data);
                        return; // Success, exit function
                    } else {
                        throw new Error('Invalid weather data received.');
                    }

                } catch (error) {
                    attempts++;
                    console.error('Fetch attempt ' + attempts + ' failed:', error);
                    if (attempts >= maxAttempts) {
                        showError('Could not fetch weather. Please check the city name and try again.');
                    } else {
                        // Exponential backoff: wait 1s, 2s, 4s
                        await new Promise(res => setTimeout(res, initialDelay * Math.pow(2, attempts - 1)));
                    }
                }
            }
            
            hideLoading(); // Ensure loading is hidden after retries
        }

        /**
         * Displays the fetched weather data on the UI
         * @param {object} data - The weather data from the API
         */
        function displayWeather(data) {
            try {
                // --- Current Conditions ---
                const current = data.current_condition[0];
                const location = data.nearest_area[0];

                locationNameEl.textContent = `${location.areaName[0].value}, ${location.country[0].value}`;
                const desc = current.weatherDesc[0].value;
                weatherDescEl.textContent = desc;
                weatherEmojiEl.textContent = getWeatherEmoji(desc);
                currentTempEl.textContent = current.temp_C;
                feelsLikeEl.textContent = `Feels like: ${current.FeelsLikeC}°C`;
                humidityEl.textContent = `${current.humidity}%`;
                windSpeedEl.textContent = `${current.windspeedKmph} km/h`;

                // --- 3-Day Forecast ---
                forecastContainer.innerHTML = ''; // Clear previous forecast
                const forecastDays = data.weather.slice(0, 3); // Get first 3 days

                forecastDays.forEach((day, index) => {
                    const dayName = (index === 0) ? 'Today' : (index === 1) ? 'Tomorrow' : new Date(day.date).toLocaleDateString('en-US', { weekday: 'long' });
                    const avgTemp = day.avgtempC;
                    const dayDesc = day.hourly[4].weatherDesc[0].value; // Get midday description
                    const emoji = getWeatherEmoji(dayDesc);

                    const card = `
                        <div class="bg-white/80 p-4 rounded-lg shadow-sm flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <span class="text-3xl">${emoji}</span>
                                <div>
                                    <p class="text-lg font-semibold text-gray-800">${dayName}</p>
                                    <p class="text-sm text-gray-600 capitalize">${dayDesc}</p>
                                </div>
                            </div>
                            <p class="text-xl font-bold text-gray-900">${avgTemp}°C</p>
                        </div>
                    `;
                    forecastContainer.innerHTML += card;
                });

                // Show results
                hideLoading();
                hideError();
                showWeather();

            } catch (error) {
                console.error('Error displaying weather:', error);
                showError('Failed to display weather data. The data format might be unexpected.');
                hideLoading();
                hideWeather();
            }
        }

        /**
         * Maps weather description to a simple emoji
         * @param {string} description - The weather description text
         * @returns {string} An emoji character
         */
        function getWeatherEmoji(description) {
            const desc = description.toLowerCase();
            if (desc.includes('sunny') || desc.includes('clear')) return '☀️';
            if (desc.includes('partly cloudy')) return '⛅️';
            if (desc.includes('cloudy') || desc.includes('overcast')) return '☁️';
            if (desc.includes('mist') || desc.includes('fog')) return '🌫️';
            if (desc.includes('rain') || desc.includes('drizzle')) return '🌧️';
            if (desc.includes('thunder') || desc.includes('storm')) return '⛈️';
            if (desc.includes('snow') || desc.includes('sleet') || desc.includes('blizzard')) return '❄️';
            return '🌍'; // Default
        }

        // --- UI State Functions ---
        function showLoading() {
            loadingEl.classList.remove('hidden');
            hideError();
            hideWeather();
        }
        
        function hideLoading() {
            loadingEl.classList.add('hidden');
        }
        
        function showError(message) {
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
            hideLoading();
            hideWeather();
        }
        
        function hideError() {
            errorEl.classList.add('hidden');
        }
        
        function showWeather() {
            weatherResultEl.classList.remove('hidden');
        }
        
        function hideWeather() {
            weatherResultEl.classList.add('hidden');
        }

    </script>
</body>
</html>
